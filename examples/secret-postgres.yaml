# PostgreSQL connection secret for sqlpod.
# Apply with: kubectl apply -n <namespace> -f secret-postgres.yaml
apiVersion: v1
kind: Secret
metadata:
  name: sqlpod-conn-secret
type: Opaque
stringData:
  # Read-only login (e.g. GRANT pg_read_all_data, or per-schema SELECT).
  # Read mode also runs in a server-enforced READ ONLY transaction.
  conn-string: "postgres://reader:password@pg.example.internal:5432/mydb?sslmode=require"
  # Optional write-capable login, used only by `query.sh query --write ...`.
  # conn-string-write: "postgres://writer:password@pg.example.internal:5432/mydb?sslmode=require"
