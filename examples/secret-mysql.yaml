# MySQL connection secret for sqlpod.
# Apply with: kubectl apply -n <namespace> -f secret-mysql.yaml
#
# IMPORTANT: on MySQL, DDL (CREATE/ALTER/DROP...) auto-commits and escapes
# both the READ ONLY transaction and the rollback. The login's privileges are
# the ONLY guard against DDL in read mode — grant SELECT only.
apiVersion: v1
kind: Secret
metadata:
  name: sqlpod-conn-secret
type: Opaque
stringData:
  # SELECT-only login. The mysql:// URL is translated internally to the
  # go-sql-driver format with parseTime=true (datetimes come back RFC 3339).
  conn-string: "mysql://reader:password@mysql.example.internal:3306/mydb"
  # Optional write-capable login, used only by `query.sh query --write ...`.
  # conn-string-write: "mysql://writer:password@mysql.example.internal:3306/mydb"
