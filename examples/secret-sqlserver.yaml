# SQL Server connection secret for sqlpod.
# Apply with: kubectl apply -n <namespace> -f secret-sqlserver.yaml
# (equivalent to: ./manage.sh set-conn "sqlserver://..."; both coexist fine)
apiVersion: v1
kind: Secret
metadata:
  name: sqlpod-conn-secret
type: Opaque
stringData:
  # Read-only login (e.g. db_datareader membership). This is the primary
  # read-only guard: T-SQL has no read-only transactions, so on SQL Server the
  # rollback is the only in-engine layer.
  conn-string: "sqlserver://reader:password@sql.example.internal:1433?database=mydb&encrypt=true"
  # Optional write-capable login, used only by `query.sh query --write ...`.
  # Omit this key entirely on shared pods.
  # conn-string-write: "sqlserver://writer:password@sql.example.internal:1433?database=mydb&encrypt=true"
